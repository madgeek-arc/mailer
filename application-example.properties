# Example configuration for mailer-service. Copy, fill the placeholders and pass it with
#   --spring.config.additional-location=file:./application.properties
# Never commit real credentials.

server.port=8080
server.servlet.context-path=/mailer

# Require this value in the X-API-Key header of every request (recommended). Unset: no authentication.
mail.api-key=<api-key>

# One block per sender account; <name> here is "noreply".
mail.mailer.noreply.username=<smtp-username>
mail.mailer.noreply.password=<smtp-password>
mail.mailer.noreply.props.mail.from=<sender-address>
mail.mailer.noreply.props.mail.display-name=<display-name>
mail.mailer.noreply.props.mail.transport.protocol=smtp
mail.mailer.noreply.props.mail.smtp.host=<smtp-host>
mail.mailer.noreply.props.mail.smtp.port=587
mail.mailer.noreply.props.mail.smtp.auth=true
mail.mailer.noreply.props.mail.smtp.starttls.enable=true
# SMTP timeouts default to connectiontimeout=10000, timeout=30000, writetimeout=30000 (ms); override if needed:
# mail.mailer.noreply.props.mail.smtp.timeout=10000

# Non-production: deliver everything to the team instead of real recipients.
mail.redirect.enabled=false
mail.redirect.to=<dev-address-1>,<dev-address-2>
mail.redirect.include-original-recipients-masked=false

logging.level.root=INFO

# Client side (in the application embedding mailer-client):
# mailer.client.host=http://<mailer-host>:8080/mailer
# mailer.client.api-key=<api-key>
# mailer.client.connect-timeout=5s
# mailer.client.read-timeout=10s
