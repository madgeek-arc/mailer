mail.mailer.XXX.username=
mail.mailer.XXX.password=
mail.mailer.XXX.props.mail.user=
mail.mailer.XXX.props.mail.from=
mail.mailer.XXX.props.mail.host=
mail.mailer.XXX.props.mail.transport.protocol=smtp
mail.mailer.XXX.props.mail.mime.address.strict=false
mail.mailer.XXX.props.mail.debug.auth=true

# Debug/test/beta: deliver every message to the addresses below instead of the original recipients.
# Startup fails if enabled without at least one valid address.
mail.redirect.enabled=false
mail.redirect.to=dev1@example.org,dev2@example.org
# Append masked original recipients (s***@g***.com) to the message body
mail.redirect.include-original-recipients-masked=false

logging.level.root=INFO
logging.level.jakarta.mail=TRACE
